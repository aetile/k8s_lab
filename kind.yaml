# Cluster kind à 3 nœuds : 1 plan de contrôle + 2 workers.
# Création :  kind create cluster --name cka --config kind.yaml
# Suppression : kind delete cluster --name cka
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    image: kindest/node:v1.35.8
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Ports exposés sur la machine hôte pour tester un Ingress (ex. ingress-nginx).
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.35.8
  - role: worker
    image: kindest/node:v1.35.8

networking:
  # Pour exercer les NetworkPolicies (semaine 3), le CNI par défaut de kind
  # (kindnet) ne les applique pas. Désactivez-le et installez Calico ou Cilium :
  # disableDefaultCNI: true
  # podSubnet: "192.168.0.0/16"
  apiServerAddress: "127.0.0.1"
