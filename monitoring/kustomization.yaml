apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - servicemonitor.yaml
  - prometheusrule.yaml

# Le sidecar de Grafana charge tout ConfigMap portant le label grafana_dashboard.
configMapGenerator:
  - name: demo-app-dashboard
    files:
      - demo-app-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
