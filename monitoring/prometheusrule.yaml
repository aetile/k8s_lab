apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: demo-app
      rules:
        - alert: DemoAppHighErrorRate
          expr: |
            sum(rate(http_requests_total{job="demo-app", status=~"5.."}[5m]))
              /
            sum(rate(http_requests_total{job="demo-app"}[5m])) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Taux d'erreurs 5xx supérieur à 5 % sur demo-app"
            description: "Plus de 5 % des requêtes renvoient une erreur 5xx depuis 2 minutes."
        - alert: DemoAppDown
          expr: sum(up{job="demo-app"}) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Plus aucune instance de demo-app ne répond"
